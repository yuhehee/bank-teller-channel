# Result codes
0000=정상 처리
E001=사번 또는 비밀번호가 올바르지 않습니다.
E010=입력값이 올바르지 않습니다.
E101=존재하지 않는 계좌입니다.
E102=비밀번호가 일치하지 않습니다.
E103=잔액이 부족합니다.
E104=거래할 수 없는 계좌 상태입니다.
E201=책임자 인증에 실패했습니다.
A001=책임자 승인이 필요한 거래입니다.
E202=유효하지 않은 책임자 승인번호입니다.
E301=원거래를 찾을 수 없습니다.
E302=이미 취소된 거래입니다.
E303=당일 거래만 취소할 수 있습니다.
E304=잔액이 부족하여 입금 취소를 할 수 없습니다.
E404=존재하지 않는 API입니다.
E999=시스템 오류가 발생했습니다. 잠시 후 다시 시도하세요.

# Detail messages
msg.invalid-format=요청 형식이 올바르지 않습니다.