# Result codes
0000=Success
E001=Invalid employee ID or password.
E010=Invalid input.
E101=The account does not exist.
E102=The password does not match.
E103=Insufficient balance.
E104=This account is not available for transactions.
E201=Manager authentification failed.
A001=This transaction requires manager approval.
E202=Invalid manager approval number.
E301=The original transaction was not found.
E302=This transaction has already been canceled.
E303=Only same-day transactions can be canceled.
E304=The deposit cannot be canceled due to insufficient balance.
E404=The requested API does not exist.
E999=A system error occurred. Please try again later.

# Detail messages
msg.invalid-format=The request format is invalid.